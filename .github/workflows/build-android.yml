name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - avioverse-starter

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avioverse-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 7
